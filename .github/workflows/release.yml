# Publishes to npm when a version tag is pushed, through npm trusted
# publishing: no token is stored, and the package carries provenance.
# A version that is already on npm (1.0.0 was published by hand, before
# trusted publishing could be set up) is tested but not published again.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip a version that is already on npm
        id: npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if curl -fs -o /dev/null "https://registry.npmjs.org/bitinz/$version"; then
            echo "bitinz@$version is already on npm: it is tested but not published again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm test
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --access public
